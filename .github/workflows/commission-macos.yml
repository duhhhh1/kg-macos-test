name: macOS native commission tests

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verify both SSH directions first, then run project tests
        required: true
        default: ssh-only
        type: choice
        options:
          - atrust-preflight
          - atrust-manual
          - atrust-ssh-only
          - atrust-full-tests
          - ssh-only
          - full-tests
      task:
        description: Native input set to execute after SSH verification
        required: true
        default: original
        type: choice
        options:
          - original
          - showcase
      showcase_sha256:
        description: Frozen showcase ZIP SHA-256 (required for showcase)
        required: false
        type: string

permissions:
  contents: read

# The server model and evidence import are shared. Serialize test jobs.
concurrency:
  group: kg-commission-macos
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Provision Python for the current five-case showcase replay
        if: inputs.task == 'showcase'
        run: brew list python@3.11 >/dev/null 2>&1 || brew install python@3.11
      - name: Join the project tailnet when enabled
        if: vars.KG_USE_TAILSCALE == 'true' && !startsWith(inputs.phase, 'atrust-')
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:kg-ci
          hostname: kg-macos-${{ github.run_id }}-${{ github.run_attempt }}
          version: 1.104.2
          use-cache: 'false'
          args: --accept-dns=false
          ping: ${{ vars.KG_SSH_HOST }}
      - name: Inspect the university aTrust client on actual macOS
        if: inputs.phase == 'atrust-preflight'
        run: python3 -u scripts/inspect_commission_atrust.py --output ci-public
      - name: Native execution, SSH model connection and evidence import
        if: inputs.phase != 'atrust-preflight' && inputs.phase != 'atrust-manual'
        env:
          KG_SSH_HOST: ${{ vars.KG_SSH_HOST || 'tibaiot.7766.org' }}
          KG_SSH_PORT: ${{ vars.KG_SSH_PORT || '60005' }}
          KG_SSH_USER: ${{ vars.KG_SSH_USER || 'dujx' }}
          KG_MACOS_KIT_SHA256: ${{ vars.KG_MACOS_KIT_SHA256 || 'e8adf68fba1ac031737a0af5101f63cb04b7cb64da0758c42378957c52a8c555' }}
          KG_CI_SSH_KEY: ${{ secrets.KG_CI_SSH_KEY }}
          KG_CI_SSH_KNOWN_HOSTS: ${{ secrets.KG_CI_SSH_KNOWN_HOSTS }}
          KG_TEST_PHASE: ${{ inputs.phase }}
          HIT_VPN_USERNAME: ${{ secrets.HIT_VPN_USERNAME }}
          HIT_VPN_PASSWORD: ${{ secrets.HIT_VPN_PASSWORD }}
        run: |
          if [ "$KG_TEST_PHASE" = "atrust-ssh-only" ]; then
            python3 -u scripts/login_commission_atrust.py --ssh-only
          elif [ "$KG_TEST_PHASE" = "atrust-full-tests" ]; then
            python3 -u scripts/login_commission_atrust.py
          elif [ "$KG_TEST_PHASE" = "ssh-only" ]; then
            python3 -u scripts/run_commission_macos_actions.py --output ci-results --ssh-only
          else
            python3 -u scripts/run_commission_macos_actions.py --output ci-results
          fi
      - name: Prepare protected manual Mac screen without automatic account login
        if: inputs.phase == 'atrust-manual'
        env:
          KG_MANUAL_ACCESS_TOKEN: ${{ secrets.KG_MANUAL_ACCESS_TOKEN }}
          KG_SSH_HOST: ${{ vars.KG_SSH_HOST || 'tibaiot.7766.org' }}
          KG_SSH_PORT: ${{ vars.KG_SSH_PORT || '60005' }}
        run: python3 -u scripts/commission_macos_manual.py prepare --state ci-manual
      - name: Publish only the protected screen address for the existing workbench
        if: inputs.phase == 'atrust-manual'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commission-macos-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-public/manual-session.json
          if-no-files-found: error
          retention-days: 1
      - name: Wait for manual school login, then execute native project tests
        if: inputs.phase == 'atrust-manual'
        env:
          KG_NATIVE_TASK: ${{ inputs.task }}
          KG_SHOWCASE_BUNDLE_SHA256: ${{ inputs.showcase_sha256 }}
          KG_SSH_HOST: ${{ vars.KG_SSH_HOST || 'tibaiot.7766.org' }}
          KG_SSH_PORT: ${{ vars.KG_SSH_PORT || '60005' }}
          KG_SSH_USER: ${{ vars.KG_SSH_USER || 'dujx' }}
          KG_MACOS_KIT_SHA256: ${{ vars.KG_MACOS_KIT_SHA256 || 'e8adf68fba1ac031737a0af5101f63cb04b7cb64da0758c42378957c52a8c555' }}
          KG_CI_SSH_KEY: ${{ secrets.KG_CI_SSH_KEY }}
          KG_CI_SSH_KNOWN_HOSTS: ${{ secrets.KG_CI_SSH_KNOWN_HOSTS }}
        run: python3 -u scripts/commission_macos_manual.py wait --state ci-manual --timeout 1800
      - name: Close this run's temporary screen and HTTPS connection
        if: always() && inputs.phase == 'atrust-manual'
        run: python3 -u scripts/commission_macos_manual.py cleanup --state ci-manual
      - name: Preserve public status summary (full evidence returns to the workbench)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commission-macos-15-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-public/
          if-no-files-found: error
          retention-days: 7
